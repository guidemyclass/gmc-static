<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <style>
    .logo-text { font-family: Arial, sans-serif; font-weight: bold; }
    .essays-text { fill: #FFCB45; font-size: 28px; }
    .inn-text { fill: #FFFFFF; font-size: 28px; }
    .logo-box { fill: #FFCB45; rx: 12; ry: 12; }
  </style>
  <g transform="translate(0, 35)">
    <text class="logo-text essays-text" x="5" y="25">Essays</text>
    <rect class="logo-box" x="65" y="-10" width="30" height="40"/>
    <text class="logo-text inn-text" x="68" y="25">Inn</text>
  </g>
</svg>
